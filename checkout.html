                letter-spacing: 0px;
                background: #0a0c0a;

            /* Container */

                max-width: 1200px;

            }

            /* Content Area */

            /* Typography */
            h1, h2, h3, h4, h5, h6 {
                color: #00ff41;

            }

            h1 { font-size: 36.0px; }
            h2 { font-size: 28.799999999999997px; }
            h3 { font-size: 24.0px; }

            p {
                margin-bottom: 1em;
            }

            /* Links */
            a {
                color: #00ff41;
                text-decoration: none;
                transition: color 0.3s ease;

            a:hover {
                color: #39ff14;
                text-decoration: underline;
            }

            button, .btn {
                background: #00ff41;
                color: #0a0c0a;
                border: none;
                border-radius: 12px;
                padding: 12px 24px;

                font-weight: bold;
                font-size: 16px;
                font-family: inherit;
                transition: all 0.3s ease;
                display: inline-block;
            }

            button:hover, .btn:hover {
                background: #00cc34;
                transform: translateY(-2px);
            }

            button:active, .btn:active {
                transform: translateY(0);
            }

            /* Cards */
            .card {
                background: #0d1412;
                border: 1px solid #00cc34;
                border-radius: 12px;
                padding: 20px;
                margin: 15px 0;
            }

            .card-title {
                color: #00ff41;
                margin-bottom: 10px;
            }

            /* Grid Layouts */
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 20px;
                margin: 20px 0;
            }

            /* Images */
            img {
                max-width: 100%;
                height: auto;
                border-radius: 12px;
            }

            /* Forms */
            input, textarea, select {
                background: #0a0c0a;
                color: #33ff66;
                border: 1px solid #00cc34;
                border-radius: 6px;
                padding: 10px;
                font-family: inherit;
                font-size: 16px;
                width: 100%;

            }

            input:focus, textarea:focus, select:focus {
                outline: none;
                border-color: #00ff41;
                box-shadow: 0 0 5px #00ff41;
            }

            /* Lists */
            ul, ol {
                padding-left: 25px;
                margin-bottom: 1em;
            }

            /* Tables */
            table {
                width: 100%;
                border-collapse: collapse;
                margin: 15px 0;
            }

            th, td {
                border: 1px solid #00cc34;
                padding: 10px;
                text-align: left;
            }

            th {
                background: #0d1412;
                color: #00ff41;
            }

            /* Status Colors */
            .success { color: #00ff88; }
            .warning { color: #ffaa33; }

            /* Navigation */
            .nav {
                background: #0d1412;
                border-bottom: 1px solid #00cc34;
                padding: 15px 0;
                margin-bottom: 30px;
                position: sticky;
                top: 0;

            .nav .container {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 15px;
            }

            .nav a {
                color: #33ff66;
                margin-left: 20px;
                transition: color 0.3s ease;
            }

            .nav a:hover {
                color: #00ff41;
            }

            .logo {

                font-weight: bold;
                color: #00ff41;
            }

            /* Footer */
            footer {

                padding: 30px 20px;
                background: #0d1412;
                border-top: 1px solid #00cc34;
                margin-top: 40px;
                color: #66ff99;
            }

            /* Responsive Design */
            @media (max-width: 768px) {
                .container { padding: 15px; }
                .content { padding: 20px; }
                .nav .container {
                    flex-direction: column;
                    text-align: center;
                }
                .nav a {

                }
                .grid {
                    grid-template-columns: 1fr;
                }
                h1 { font-size: 28.799999999999997px; }
                h2 { font-size: 24.0px; }
            }

            @media (max-width: 480px) {
                .content { padding: 15px; }
                button, .btn { padding: 8px 16px; }
            }

            /* Print Styles */
            @media print {
                .nav, footer {
                    display: none;
                }
                body {
                    background: white;
                    color: black;
                }
                .content {
                    box-shadow: none;
                    border: 1px solid #ccc;
                }
            }

            /* Animations & Effects */
            
            .card, button, .btn, .project-card, .service-card {
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .card:hover, .project-card:hover, .service-card:hover {
                transform: translateY(-5px);
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .content, .card, .project-card {
                animation: fadeIn 0.5s ease-out;
            }
        
            
            .btn:hover, button:hover, .card:hover .btn {
                box-shadow: 0 0 15px #00ff41, 0 0 5px #00cc34;
                transition: all 0.3s ease;
            }
        

            /* Scrollbar Styling */

            ::-webkit-scrollbar-track {

        <div class="nav">
            <div class="container">
                <div class="logo">🏠 ega</div>
                <div class="menu">
                    <a href="index.html">Главная</a><a href="shop.html">Shop</a><a href="cart.html">Cart</a><a href="checkout.html">Checkout</a>

        <div class="container">
            <div class="content">
                <div>
  <h1>Оформление заказа</h1>
  
  <div>
    <div>
      <h2>Контактные данные</h2>
      <form id="checkout-form">
        <input type="text" name="from_name" placeholder="ФИО" required>
        <input type="email" name="from_email" placeholder="Email" required>
        <input type="tel" name="phone" placeholder="Телефон" required>
        <textarea name="address" placeholder="Адрес доставки" rows="4" required></textarea>
      </form>
    </div>

    <div>
      <h2>Ваш заказ</h2>
      <div id="order-summary">
      </div>
      <button onclick="placeOrder()" id="place-order-btn" class="btn">Подтвердить заказ</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
emailjs.init('8KPENbHiyHjeOZQU');

const cart = JSON.parse(localStorage.getItem('cart')) || [];
const summaryContainer = document.getElementById('order-summary');
const placeBtn = document.getElementById('place-order-btn');

function renderOrderSummary() {
  if (cart.length === 0) {
    summaryContainer.innerHTML = '<p>Корзина пуста</p>';
    return 0;
  }
  let html = '<h3>Товары:</h3>';
  let total = 0;
  cart.forEach(item => {
    const itemTotal = item.price * item.quantity;
    total += itemTotal;
    html += `<p>${item.name} × ${item.quantity} = <strong>$${itemTotal}</strong></p>`;
  });
  html += `<hr><h3>Итого: $${total}</h3>`;
  summaryContainer.innerHTML = html;
  return total;
}

function placeOrder() {
  if (cart.length === 0) return alert('Корзина пуста');

  const form = document.getElementById('checkout-form');
  const formData = new FormData(form);
  const total = renderOrderSummary();

  let orderDetails = '';
  cart.forEach(item => {
    orderDetails += `- ${item.name} × ${item.quantity} шт. = $${item.price * item.quantity}\n`;
  });

  placeBtn.disabled = true;
  placeBtn.textContent = 'Отправляем...';

  emailjs.send('service_i4q84st', 'template_ga0qo5w', {
    from_name: formData.get('from_name'),
    from_email: formData.get('from_email'),
    phone: formData.get('phone') || 'Не указан',
    address: formData.get('address') || 'Не указан',
    message: orderDetails,
    total: total,
    site_name: 'Мой Магазин',
    date: new Date().toLocaleString('ru-RU')
  })
  .then(() => {
    alert('✅ Заказ успешно отправлен на почту!');
    localStorage.removeItem('cart');
    window.location.href = 'index.html';
  })
  .catch((err) => {
    console.error('EmailJS Error:', err);
    alert('❌ Ошибка отправки. Проверьте консоль (F12).');
  })
  .finally(() => {
    placeBtn.disabled = false;
    placeBtn.textContent = 'Подтвердить заказ';
  });
}

renderOrderSummary();
</script>
            </div>
        </div>
